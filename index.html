<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Predictor - Bahawalpur</title>
    <style>
        :root {
            --primary: #00796b;
            --primary-dark: #004d40;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 121, 107, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e0f2f1;
            border-left: 5px solid var(--primary);
            border-radius: 4px;
            display: none;
            font-size: 1.05em;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #555;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Solar Energy Output Estimation</h2>
        <p class="subtitle">From Weather Forecasts for Bahawalpur</p>

        <form id="solarForm">
            <div class="form-group">
                <label for="system_size">System Size (kW) ⚡</label>
                <input type="number" id="system_size" step="0.1" value="5.0" required placeholder="e.g., 5.0 or 10.0">
            </div>

            <div class="form-group">
                <label for="temp">Temperature (°C) 🌡️</label>
                <input type="number" id="temp" step="0.1" required placeholder="Loading...">
            </div>

            <div class="form-group">
                <label for="humidity">Relative Humidity (%) 💧</label>
                <input type="number" id="humidity" step="0.1" required placeholder="Loading...">
            </div>

            <div class="form-group">
                <label for="wind">Wind Speed (m/s) 💨</label>
                <input type="number" id="wind" step="0.1" required placeholder="Loading...">
            </div>

            <div class="form-group">
                <label for="rain">Precipitation (mm) 🌧️</label>
                <input type="number" id="rain" step="0.1" required placeholder="Loading...">
            </div>

            <button type="submit">Predict Tomorrow's Yield</button>
        </form>

        <div id="loadingMessage" class="loading">
            <!-- Loading text injected via JS -->
        </div>

        <div id="resultBox" class="result-box">
            <!-- Results will be injected here via JavaScript -->
        </div>
    </div>

    <script>
        // Bahawalpur Coordinates
        const LAT = 29.39;
        const LON = 71.67;

        // Auto-fetch tomorrow's weather on page load
        document.addEventListener("DOMContentLoaded", async () => {
            const loadingMessage = document.getElementById('loadingMessage');
            loadingMessage.innerText = "Fetching local weather forecast from Open-Meteo...";
            loadingMessage.style.display = 'block';

            try {
                // Fetch daily forecast from Open-Meteo (Free, no API key required)
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,precipitation_sum,windspeed_10m_max&hourly=relative_humidity_2m&timezone=auto`;
                
                const response = await fetch(weatherUrl);
                if (!response.ok) throw new Error("Weather API failed");
                
                const data = await response.json();
                
                // Extract tomorrow's data (index 1 in the daily array)
                const tempMax = data.daily.temperature_2m_max[1];
                const windSpeed = data.daily.windspeed_10m_max[1]; // km/h
                const rain = data.daily.precipitation_sum[1]; // mm
                
                // Calculate average humidity for tomorrow from hourly data (hours 24 to 47)
                const tomorrowHumidityData = data.hourly.relative_humidity_2m.slice(24, 48);
                const avgHumidity = (tomorrowHumidityData.reduce((a, b) => a + b, 0) / 24).toFixed(1);

                // Auto-fill the HTML form
                document.getElementById('temp').value = tempMax.toFixed(1);
                document.getElementById('humidity').value = avgHumidity;
                document.getElementById('wind').value = (windSpeed / 3.6).toFixed(1); // Convert km/h to m/s
                document.getElementById('rain').value = rain.toFixed(1);

                loadingMessage.style.display = 'none';

            } catch (error) {
                console.error('Error fetching weather:', error);
                loadingMessage.innerText = "Failed to auto-fetch weather. Please enter manually.";
                setTimeout(() => { loadingMessage.style.display = 'none'; }, 3000);
            }
        });

        // Your existing prediction logic connecting to Python backend
        document.getElementById('solarForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 

            const resultBox = document.getElementById('resultBox');
            const loadingMessage = document.getElementById('loadingMessage');
            
            resultBox.style.display = 'none';
            loadingMessage.innerHTML = "Calculating prediction...<br><span style='font-size: 0.85em;'>(This may take up to 60 seconds if the free server is waking up)</span>";
            loadingMessage.style.display = 'block';

            const requestData = {
                T2M: parseFloat(document.getElementById('temp').value),
                RH2M: parseFloat(document.getElementById('humidity').value),
                WS2M: parseFloat(document.getElementById('wind').value),
                PRECTOTCORR: parseFloat(document.getElementById('rain').value),
                system_kw: parseFloat(document.getElementById('system_size').value)
            };

            try {
                // IMPORTANT: Replace the URL below with your actual Render API link
                const response = await fetch('https://YOUR-APP-NAME.onrender.com/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const resultData = await response.json();
                
                loadingMessage.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.style.borderLeftColor = 'var(--primary)';
                resultBox.style.backgroundColor = '#e0f2f1';
                resultBox.innerHTML = `
                    <strong>Prediction Success! ✅</strong><br><br>
                    <strong>Raw Irradiance:</strong> ${resultData.raw_irradiance_kwh_m2} kWh/m²<br>
                    <strong style="color: var(--primary); font-size: 1.2em; display: inline-block; margin-top: 10px;">
                        Estimated Yield: ${resultData.estimated_yield_kwh} Units (kWh)
                    </strong>
                `;

            } catch (error) {
                console.error('Error fetching prediction:', error);
                loadingMessage.style.display = 'none';
                resultBox.style.display = 'block';
                resultBox.style.borderLeftColor = 'red';
                resultBox.style.backgroundColor = '#ffebee';
                resultBox.innerHTML = `<strong>Connection Error ❌</strong><br>Failed to connect to the prediction model. Please make sure your Render API is live.`;
            }
        });
    </script>
</body>
</html>
